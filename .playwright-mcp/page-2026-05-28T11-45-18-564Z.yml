          - paragraph [ref=e240]: Mai scump decât implementarea nativă — dar funcționează. Orice circuit din lume poate fi redus la o rețea de NAND-uri identice.
          - heading "De la combinațional la secvențial — memoria din buclă" [level=3] [ref=e241]
          - paragraph [ref=e242]:
            - text: Toate porțile de până acum sunt
            - strong [ref=e243]: combinaționale
