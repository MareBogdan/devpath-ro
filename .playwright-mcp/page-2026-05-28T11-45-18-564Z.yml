                  - strong [ref=e149]: "1.66"
          - paragraph [ref=e150]: NOR e cu 25% mai „greu" decât NAND. La miliarde de porți, diferența decide dacă telefonul tău ține o zi sau două.
          - generic [ref=e151]:
            - generic [ref=e152]:
