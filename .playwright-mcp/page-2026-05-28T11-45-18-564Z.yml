          - heading "NAND — cărămida Lego universală" [level=1] [ref=e49]
          - heading "HOOK" [level=2] [ref=e50]
          - paragraph [ref=e51]: Tocmai am spus că există o singură poartă din care le poți construi pe toate celelalte.
          - paragraph [ref=e52]: Nu e o metaforă. E matematică pură.
          - paragraph [ref=e53]: Procesorul din telefonul tău — cu 28 de miliarde de tranzistoare — poate fi descris în întregime ca o rețea de porți NAND interconectate. XOR-ul din lecția anterioară? NAND. Inversor? NAND. Jumătatea de sumator care adună biți? Tot NAND.
          - paragraph [ref=e54]: Privit dintr-un satelit imaginar deasupra siliciului, un cip modern e o mare uniformă de un singur tip de element — copiat de miliarde de ori, conectat în milioane de combinații diferite. Aceeași cărămidă. Construcții diferite. Orice calcul posibil.
          - paragraph [ref=e55]: Dar de ce NAND și nu altceva? De ce nu AND, nu OR, nu XOR?
          - paragraph [ref=e56]: Răspunsul e fizică. Și e mai elegant decât te-ai aștepta.
          - heading "CONTEXT" [level=2] [ref=e57]
          - paragraph [ref=e58]: NAND înseamnă NOT-AND. Ieșirea e 0 doar când toate intrările sunt 1 — în orice altă situație, ieșirea e 1.
          - paragraph [ref=e59]: "Gândește-te la un seif cu două chei de securitate. Alarma se oprește doar când ambele chei sunt introduse simultan. Dacă lipsește una — oricare — alarma rămâne activă. Asta e NAND: output 0 doar când toți spun DA în același timp."
