          - paragraph [ref=e88]: "Un singur caz produce zero. Restul trei produc unu. Poarta e pesimistă: dacă măcar un semnal e 0, ieșirea rămâne 1. Doar când toți spun „da\" simultan, ieșirea cade la 0."
          - paragraph [ref=e89]: Această asimetrie e cheia universalității sale.
          - heading "MIEZUL" [level=2] [ref=e90]
          - heading "4 tranzistoare. Nu 6, nu 8 — 4." [level=3] [ref=e91]
          - paragraph [ref=e92]: "Orice poartă logică CMOS are două rețele: una care trage ieșirea spre 1 (rețeaua pull-up, cu tranzistoare PMOS) și una care o trage spre 0 (rețeaua pull-down, cu tranzistoare NMOS)."
          - paragraph [ref=e93]: "La NAND cu 2 intrări:"
          - list [ref=e94]:
            - listitem [ref=e95]:
              - strong [ref=e96]: Pull-down
              - text: ": 2 tranzistoare NMOS"
              - strong [ref=e97]: în serie
              - text: — ieșirea ajunge la 0 doar dacă ambii conduc simultan (A=1 ȘI B=1)
            - listitem [ref=e98]:
              - strong [ref=e99]: Pull-up
              - text: ": 2 tranzistoare PMOS"
              - strong [ref=e100]: în paralel
              - text: — ieșirea ajunge la 1 dacă oricare conduce (A=0 SAU B=0)
          - paragraph [ref=e101]: "Total: 4 tranzistoare. Cea mai compactă structură posibilă pentru o funcție cu două intrări."
          - paragraph [ref=e102]:
            - text: Prin contrast, o poartă AND pură nu există în CMOS. Ca să obții AND, pui un NAND (4 tranzistoare) urmat de un inversor NOT (2 tranzistoare) =
            - strong [ref=e103]: 6 tranzistoare și două etape de întârziere
            - text: . La fel pentru OR.
          - paragraph [ref=e104]: NAND și NOR sunt primitivele fizice reale. AND și OR sunt derivate.
          - generic [ref=e106]:
            - img [ref=e108]
            - paragraph [ref=e111]: Creierul uman percepe AND și OR ca operații "naturale", intuitive. Fizica siliciului nu e de acord — NAND și NOR sunt singurele porți care se implementează direct în CMOS cu 4 tranzistoare. AND și OR necesită întotdeauna un etaj extra de inversie.
          - heading "De ce NAND a câștigat față de NOR" [level=3] [ref=e112]
          - paragraph [ref=e113]: Matematic, NAND și NOR sunt echivalente. Ambele sunt universale. Dar în orice procesor modern, algoritmii de sinteză preferă copleșitor NAND.
          - paragraph [ref=e114]: "Motivul: electronii și golurile nu se mișcă la fel de repede."
          - paragraph [ref=e115]:
            - text: În tranzistoarele NMOS, curentul e purtat de
            - strong [ref=e116]: electroni
            - text: "— particule cu masă efectivă mică. Mobilitate:"
            - strong [ref=e117]: 1400 cm²/V·s
            - text: .
          - paragraph [ref=e118]:
            - text: În tranzistoarele PMOS, curentul e purtat de
            - strong [ref=e119]: goluri
            - text: "— absențe de electroni din rețeaua cristalină, care se mișcă „prin sărituri\". Mobilitate:"
            - strong [ref=e120]: 450 cm²/V·s
            - text: .
          - paragraph [ref=e121]: Golurile sunt de ~3 ori mai lente decât electronii. PMOS e mai lent, mai rezistiv.
          - paragraph [ref=e122]: "Acum compară arhitecturile:"
          - list [ref=e123]:
            - listitem [ref=e124]:
              - strong [ref=e125]: NAND
              - text: ": NMOS rapizi sunt în serie la pull-down, PMOS lenți sunt în paralel la pull-up. Conexiunea paralelă compensează rezistența ridicată a fiecărui PMOS."
            - listitem [ref=e126]:
              - strong [ref=e127]: NOR
              - text: ": PMOS lenți sunt în"
              - strong [ref=e128]: serie
              - text: la pull-up. Rezistențele se adună. Poarta devine semnificativ mai lentă la tranziția de la 0 la 1.
          - paragraph [ref=e129]: Ca să faci o poartă NOR la fel de rapidă ca o NAND echivalentă, trebuie să lățești tranzistoarele PMOS de ~4 ori — mai mult siliciu, mai multă capacitate parazită, mai mult consum.
          - paragraph [ref=e130]:
            - text: Inginerii de la Stanford au formalizat asta în
            - strong [ref=e131]: Teoria Efortului Logic
            - text: "— o metodă de a estima penalitatea de viteză a fiecărei porți:"
