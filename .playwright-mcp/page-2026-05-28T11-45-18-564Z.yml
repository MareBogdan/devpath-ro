          - heading "REVEAL" [level=2] [ref=e309]
          - paragraph [ref=e310]: "Iată paradoxul central al informaticii fizice:"
          - paragraph [ref=e311]: Mintea umană percepe AND și OR ca operații elementare, intuitive. Fizica siliciului spune că sunt derivate — construite din ceva mai primitiv.
          - paragraph [ref=e312]: NAND e primitivul real. Nu pentru că e mai ușor de înțeles, ci pentru că e mai ușor de fabricat. Patru tranzistoare, aranjate optimal față de mobilitatea electronilor. Suficient pentru tot — dovedit matematic de Post în 1941.
          - paragraph [ref=e313]: Un singur tip de poartă. Miliarde de copii. Orice calcul posibil.
          - paragraph [ref=e314]: "Asta e completitudinea funcțională: nu diversitate, ci profunzime dintr-un singur element. Și e un principiu care apare din nou și din nou în informatică — sisteme uriașe construite din primitive minuscule, repetate la scară masivă. NAND e primul exemplu. Nu va fi ultimul."
          - heading "ÎNCHEIERE" [level=2] [ref=e315]
