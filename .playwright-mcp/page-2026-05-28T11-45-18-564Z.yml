                - img
            - paragraph [ref=e155]: Efortul logic e ca rezistența aerodinamică în Formula 1. O poartă cu efort mai mare „frânează" semnalul. Compilatoarele hardware (Synopsys Design Compiler) construiesc din NAND-uri în ~90% din cazuri tocmai pentru că minimizează această rezistență cumulată pe zeci de etaje logice.
          - heading "Completitudinea funcțională — demonstrația matematică" [level=3] [ref=e156]
          - paragraph [ref=e157]:
            - text: Henry Sheffer a arătat în 1913 că există o funcție logică unică din care pot fi derivate toate celelalte. A numit-o
            - emphasis [ref=e158]: Sheffer stroke
