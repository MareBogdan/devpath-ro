            - paragraph [ref=e304]: Dacă ai construi un Apple M4 din cipuri SN7400 din 1964, ai avea nevoie de 1,75 miliarde de bucăți. Puse cap la cap, ar acoperi o suprafață de 211.750 m² — mai mult de 30 de terenuri de fotbal — pentru a replica ce stă azi sub ecranul unui iPad de 6 mm grosime.
