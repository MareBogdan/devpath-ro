          - paragraph [ref=e244]: Calculatoarele au nevoie de memorie. Și ea emerge din aceleași 4 tranzistoare, conectate diferit.
          - paragraph [ref=e245]: Ia două porți NAND. Conectează ieșirea primeia la o intrare a celei de-a doua. Conectează ieșirea celei de-a doua înapoi la o intrare a primeia.
