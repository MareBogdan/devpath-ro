<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190" font-family="system-ui, -apple-system, sans-serif">
  <!-- Row 1: hair -->
  <text x="8" y="30" fill="#e2e8f0" font-size="13" font-weight="600">Fir de păr</text>
  <rect x="8" y="38" width="196" height="16" rx="4" fill="#94a3b8"/>
  <text x="212" y="51" fill="#cbd5e1" font-size="11" font-weight="700">70.000 nm</text>

  <!-- Row 2: OLED layer -->
  <text x="8" y="88" fill="#e2e8f0" font-size="13" font-weight="600">Strat OLED</text>
  <rect x="8" y="96" width="58" height="16" rx="4" fill="#00CEC9"/>
  <text x="74" y="109" fill="#cbd5e1" font-size="11" font-weight="700">200 nm</text>

  <!-- Row 3: transistor -->
  <text x="8" y="146" fill="#e2e8f0" font-size="13" font-weight="600">Tranzistor</text>
  <rect x="8" y="154" width="14" height="16" rx="3" fill="#6C5CE7"/>
  <text x="30" y="167" fill="#cbd5e1" font-size="11" font-weight="700">3 nm &#183; 15 atomi</text>

  <!-- caption -->
  <text x="150" y="187" fill="#A78BFA" font-size="11" font-style="italic" text-anchor="middle">de ~23.000× mai subțire ca un fir de păr</text>
</svg>
