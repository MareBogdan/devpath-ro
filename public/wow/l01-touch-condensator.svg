<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" font-family="system-ui, -apple-system, sans-serif">
  <!-- finger = plate 2 -->
  <rect x="132" y="18" width="36" height="80" rx="18" fill="#f4c8a0" stroke="#d89b6c" stroke-width="2"/>
  <text x="150" y="13" fill="#f4c8a0" font-size="12.5" font-weight="700" text-anchor="middle">deget = placa 2</text>

  <!-- field lines -->
  <g stroke="#00CEC9" stroke-width="2.5" stroke-dasharray="3 4" opacity="0.9">
    <line x1="150" y1="100" x2="150" y2="138"/>
    <line x1="130" y1="98" x2="137" y2="138"/>
    <line x1="170" y1="98" x2="163" y2="138"/>
  </g>
  <text x="235" y="122" fill="#94a3b8" font-size="11.5" text-anchor="middle">sticlă = izolator</text>

  <!-- electrode grid = plate 1 -->
  <rect x="20" y="138" width="260" height="20" rx="5" fill="#6C5CE7"/>
  <g stroke="#c4b5fd" stroke-width="1.5" opacity="0.8">
    <line x1="60" y1="138" x2="60" y2="158"/>
    <line x1="110" y1="138" x2="110" y2="158"/>
    <line x1="190" y1="138" x2="190" y2="158"/>
    <line x1="240" y1="138" x2="240" y2="158"/>
  </g>
  <text x="150" y="152" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">grilă de electrozi = placa 1</text>

  <!-- caption -->
  <text x="150" y="184" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">degetul apropiat schimbă capacitanța &#8594;</text>
  <text x="150" y="201" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">ecranul „simte" fără nicio apăsare</text>
</svg>
