<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" font-family="system-ui, -apple-system, sans-serif">
  <!-- OFF state (0) -->
  <text x="16" y="34" fill="#f87171" font-size="14" font-weight="700">0 — oprit</text>
  <line x1="20" y1="58" x2="120" y2="58" stroke="#475569" stroke-width="4"/>
  <line x1="180" y1="58" x2="280" y2="58" stroke="#475569" stroke-width="4"/>
  <!-- open switch lever -->
  <circle cx="120" cy="58" r="4" fill="#f87171"/>
  <circle cx="180" cy="58" r="4" fill="#f87171"/>
  <line x1="120" y1="58" x2="168" y2="34" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <text x="150" y="86" fill="#94a3b8" font-size="12" text-anchor="middle">curentul e blocat</text>

  <!-- ON state (1) -->
  <text x="16" y="130" fill="#34d399" font-size="14" font-weight="700">1 — pornit</text>
  <line x1="20" y1="152" x2="280" y2="152" stroke="#34d399" stroke-width="4"/>
  <circle cx="120" cy="152" r="4" fill="#34d399"/>
  <circle cx="180" cy="152" r="4" fill="#34d399"/>
  <!-- flow arrow -->
  <polygon points="150,146 160,152 150,158" fill="#34d399"/>
  <text x="150" y="180" fill="#94a3b8" font-size="12" text-anchor="middle">curentul trece</text>

  <!-- gate label -->
  <text x="150" y="198" fill="#A78BFA" font-size="11.5" font-style="italic" text-anchor="middle">tensiunea pe „poartă" comută 0 ↔ 1</text>
</svg>
